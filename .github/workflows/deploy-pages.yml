name: GitHub Pagesへ配置
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: 公開先のパスを決定
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$repo" = "${owner}.github.io" ]; then
            base=""
          else
            base="/$repo"
          fi
          echo "PAGES_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${owner}.github.io${base}" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 配置
        id: deployment
        uses: actions/deploy-pages@v4
