name: ニュースを更新
on:
  schedule:
    - cron: '0 8,21 * * *' # 日本時間 17:00 / 翌朝 06:00
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RSSを取得・整理
        run: python scripts/fetch_news.py
      - name: 取得結果を検証
        run: python -m unittest discover -s tests -v
      - name: 変更がある場合だけ保存
        shell: bash
        run: |
          if git diff --quiet -- public/data/news.json; then
            echo "新しい変更はありません"
            exit 0
          fi
          git config user.name "emiko-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/news.json
          git commit -m "news: 自動更新"
          git push
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: 公開先のパスを決定
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$repo" = "${owner}.github.io" ]; then base=""; else base="/$repo"; fi
          echo "PAGES_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${owner}.github.io${base}" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: 最新ニュースを公開
        id: deployment
        uses: actions/deploy-pages@v4
